<!doctype html>
<html lang="ru">
  <head>
    <meta name="mitgo-verification" content="2ab007de-ae48-4bfa-b8aa-21a9992758fb" />
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1200px; height: 630px; overflow: hidden;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(120% 120% at 100% 0%, #292524 0%, #1c1917 55%, #0c0a09 100%);
        color: #fafaf9; padding: 72px 80px; display: flex; flex-direction: column;
        justify-content: space-between; position: relative;
      }
      .glow {
        position: absolute; right: -160px; top: -160px; width: 620px; height: 620px;
        border-radius: 50%; background: radial-gradient(circle, rgba(217,119,6,.38), transparent 65%);
      }
      .brand { display: flex; align-items: center; gap: 22px; }
      .mark {
        width: 76px; height: 76px; border-radius: 20px; background: linear-gradient(140deg, #f59e0b, #b45309);
        display: flex; align-items: center; justify-content: center; font-size: 40px;
        box-shadow: 0 18px 40px rgba(180,83,9,.35);
      }
      .brand-name { font-size: 30px; font-weight: 700; letter-spacing: .2px; }
      .brand-sub { font-size: 17px; color: #a8a29e; margin-top: 4px; }
      h1 { font-size: 66px; line-height: 1.06; font-weight: 800; letter-spacing: -1.4px; max-width: 940px; }
      h1 span { color: #fbbf24; }
      .row { display: flex; gap: 14px; flex-wrap: wrap; }
      .chip {
        border: 1px solid rgba(250,250,249,.16); background: rgba(250,250,249,.06);
        padding: 12px 20px; border-radius: 999px; font-size: 21px; color: #e7e5e4;
      }
      .foot { display: flex; justify-content: space-between; align-items: center; font-size: 21px; }
      .domain { color: #fbbf24; font-weight: 700; letter-spacing: .5px; }
      .note { color: #78716c; }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="brand">
      <div class="mark">🏠</div>
      <div>
        <div class="brand-name">Кабинет Дома</div>
        <div class="brand-sub">Эргономика · мебель · тишина · продуктивность</div>
      </div>
    </div>
    <h1>Рабочее место дома,<br />которое <span>не убивает спину</span></h1>
    <div class="row">
      <div class="chip">Калькулятор по ГОСТ</div>
      <div class="chip">Сетап под бюджет</div>
      <div class="chip">Чек-лист тишины</div>
    </div>
    <div class="foot">
      <div class="domain">kabinetdoma.ru</div>
      <div class="note">Экспертные гайды без воды</div>
    </div>
  </body>
</html>
