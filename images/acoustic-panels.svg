<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgAcoustic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgAcoustic)" />
  <rect x="0" y="370" width="800" height="80" fill="#09090b" />
  <line x1="0" y1="370" x2="800" y2="370" stroke="#3f3f46" stroke-width="2" />

  <!-- Wall with Hexagonal Felt Panels (PET Panels) -->
  <g transform="translate(420, 80)">
    <!-- Hexagon 1 -->
    <polygon points="60,0 120,34 120,104 60,138 0,104 0,34" fill="#3b82f6" fill-opacity="0.8" stroke="#93c5fd" stroke-width="2" />
    <!-- Hexagon 2 -->
    <polygon points="180,0 240,34 240,104 180,138 120,104 120,34" fill="#6366f1" fill-opacity="0.8" stroke="#a5b4fc" stroke-width="2" />
    <!-- Hexagon 3 -->
    <polygon points="120,104 180,138 180,208 120,242 60,208 60,138" fill="#f59e0b" fill-opacity="0.8" stroke="#fcd34d" stroke-width="2" />
    <!-- Hexagon 4 -->
    <polygon points="240,104 300,138 300,208 240,242 180,208 180,138" fill="#10b981" fill-opacity="0.8" stroke="#6ee7b7" stroke-width="2" />
    <!-- Hexagon 5 -->
    <polygon points="60,208 120,242 120,312 60,346 0,312 0,242" fill="#8b5cf6" fill-opacity="0.8" stroke="#c4b5fd" stroke-width="2" />

    <!-- Acoustic Absorption NRC 0.85 Badge -->
    <rect x="40" y="270" width="160" height="26" rx="6" fill="#09090b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="120" y="287" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fbbf24" text-anchor="middle">
      ПОГЛОЩЕНИЕ ЭХА (NRC 0.85)
    </text>
  </g>

  <!-- Left: Speaking User Silhouette with Sound Waves Absorbed -->
  <g transform="translate(100, 160)">
    <!-- Speaker Profile -->
    <circle cx="80" cy="50" r="30" fill="#475569" stroke="#cbd5e1" stroke-width="2" />
    <path d="M 40 140 Q 80 90 120 140 Z" fill="#334155" />

    <!-- Spreading Echo Waves (Orange) hitting panels -->
    <path d="M 125 50 Q 150 25 150 75" fill="none" stroke="#f59e0b" stroke-width="3" />
    <path d="M 145 40 Q 185 10 185 90" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.7" />
    <path d="M 170 30 Q 220 -5 220 110" fill="none" stroke="#f59e0b" stroke-width="3" opacity="0.4" />

    <!-- Clean Direct Voice Line to Mic -->
    <line x1="110" y1="58" x2="200" y2="70" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
    <text x="70" y="165" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">
      ЧИСТЫЙ ГОЛОС БЕЗ РЕЗЕРВАЦИИ
    </text>
  </g>

  <!-- Header Banner -->
  <g transform="translate(400, 48)">
    <rect x="-190" y="-18" width="380" height="34" rx="8" fill="#18181b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="0" y="4" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
      АКУСТИЧЕСКИЕ ПАНЕЛИ И ЗВУКОПОГЛОЩЕНИЕ
    </text>
  </g>
</svg>
