<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgFoot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="60%" stop-color="#292524" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgFoot)" />
  <rect x="0" y="380" width="800" height="70" fill="#0c0a09" />
  <line x1="0" y1="380" x2="800" y2="380" stroke="#44403c" stroke-width="2" />

  <!-- Ergonomic Angled Footrest with Massage Rollers -->
  <g transform="translate(420, 260)">
    <!-- Base Plate -->
    <rect x="-20" y="80" width="280" height="24" rx="6" fill="#1c1917" stroke="#78716c" stroke-width="2" />
    <rect x="0" y="104" width="30" height="16" fill="#44403c" />
    <rect x="210" y="104" width="30" height="16" fill="#44403c" />

    <!-- Angled Top Platform (15-20 deg slope) -->
    <polygon points="0,50 240,15 240,30 0,65" fill="#f59e0b" />
    <polygon points="0,35 240,0 240,15 0,50" fill="#292524" stroke="#a8a29e" stroke-width="2" />

    <!-- Texture / Massage Bumpers -->
    <circle cx="50" cy="38" r="4" fill="#f59e0b" />
    <circle cx="80" cy="32" r="4" fill="#f59e0b" />
    <circle cx="110" cy="27" r="4" fill="#f59e0b" />
    <circle cx="140" cy="21" r="4" fill="#f59e0b" />
    <circle cx="170" cy="16" r="4" fill="#f59e0b" />
    <circle cx="200" cy="10" r="4" fill="#f59e0b" />

    <!-- Feet resting comfortably with 90 deg knee angle -->
    <path d="M 40 -40 L 90 28 L 150 18" fill="none" stroke="#e7e5e4" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Blood Flow Indicator Arrow -->
    <path d="M 80 -10 Q 75 10 95 20" fill="none" stroke="#10b981" stroke-width="3" />
    <polygon points="95,15 102,23 92,25" fill="#10b981" />
  </g>

  <!-- Left: Ergonomic Sitting Anatomy Diagram -->
  <g transform="translate(140, 100)">
    <!-- Desk Surface -->
    <rect x="140" y="110" width="160" height="16" rx="3" fill="#d6d3d1" />
    <rect x="160" y="126" width="12" height="154" fill="#57534e" />

    <!-- Chair Silhouette -->
    <!-- Seat -->
    <rect x="30" y="180" width="110" height="16" rx="4" fill="#1c1917" stroke="#a8a29e" stroke-width="1.5" />
    <!-- Backrest -->
    <rect x="20" y="70" width="18" height="120" rx="8" fill="#1c1917" stroke="#a8a29e" stroke-width="1.5" />
    <!-- Lumbar Pillow (Orange) -->
    <rect x="34" y="120" width="12" height="36" rx="6" fill="#f59e0b" />

    <!-- 90 Degree Angle Annotations -->
    <!-- Knee 90 deg -->
    <path d="M 105 180 L 105 240 L 140 240" fill="none" stroke="#10b981" stroke-width="3" />
    <text x="120" y="225" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#34d399">90°–100°</text>

    <!-- Elbow 90 deg -->
    <path d="M 70 120 L 70 160 L 140 160" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <text x="80" y="145" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#38bdf8">90°</text>

    <!-- Zero Compression Label -->
    <rect x="0" y="270" width="220" height="24" rx="6" fill="#0c0a09" stroke="#10b981" stroke-width="1" />
    <text x="110" y="286" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#34d399" text-anchor="middle">
      СНЯТИЕ СДАВЛИВАНИЯ ПОДКОЛЕННЫХ ВЕН
    </text>
  </g>

  <!-- Header Banner -->
  <g transform="translate(400, 48)">
    <rect x="-190" y="-18" width="380" height="34" rx="8" fill="#1c1917" stroke="#f59e0b" stroke-width="1.5" />
    <text x="0" y="4" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
      ОРТОПЕДИЧЕСКИЕ ПОДСТАВКИ ДЛЯ НОГ
    </text>
  </g>
</svg>
