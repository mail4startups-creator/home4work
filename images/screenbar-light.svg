<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgLight)" />
  
  <!-- Desk surface below -->
  <rect x="100" y="360" width="600" height="20" rx="3" fill="#3f3f46" stroke="#71717a" stroke-width="1.5" />

  <!-- Computer Monitor -->
  <g transform="translate(230, 90)">
    <!-- Screen Bezel -->
    <rect x="0" y="0" width="340" height="200" rx="6" fill="#18181b" stroke="#52525b" stroke-width="3" />
    <!-- Display Panel (Dark mode code editor) -->
    <rect x="12" y="12" width="316" height="176" rx="3" fill="#09090b" />
    <!-- Zero Glare indicator on screen -->
    <text x="170" y="105" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#22c55e" text-anchor="middle">
      ✓ НУЛЕВЫЕ БЛИКИ НА МАТРИЦЕ
    </text>
    <text x="170" y="125" font-family="system-ui, sans-serif" font-size="10" fill="#a1a1aa" text-anchor="middle">
      Асимметричный оптический угол 45°
    </text>

    <!-- Monitor Pole and Stand -->
    <rect x="160" y="200" width="20" height="70" fill="#52525b" />
    <rect x="110" y="270" width="120" height="10" rx="3" fill="#3f3f46" />

    <!-- Screenbar mounted on top of monitor -->
    <rect x="30" y="-12" width="280" height="10" rx="3" fill="#27272a" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="45" cy="-7" r="2" fill="#ef4444" />
    
    <!-- Asymmetric Light Beam shooting ONLY forward onto desk, not into eyes or on screen -->
    <polygon points="30,-2 310,-2 460,270 -80,270" fill="url(#beam)" />
  </g>

  <!-- Illuminated Desk Items (Keyboard, notebook, mouse) -->
  <g transform="translate(300, 350)">
    <rect x="0" y="12" width="140" height="14" rx="2" fill="#27272a" stroke="#fef08a" stroke-width="1.5" />
    <rect x="160" y="12" width="28" height="16" rx="5" fill="#27272a" stroke="#f59e0b" stroke-width="1" />
  </g>

  <!-- Wireless Rotary Puck (Remote control) -->
  <g transform="translate(560, 335)">
    <circle cx="20" cy="20" r="18" fill="#27272a" stroke="#f59e0b" stroke-width="2" />
    <circle cx="20" cy="20" r="7" fill="#f59e0b" />
    <text x="20" y="48" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#f59e0b" text-anchor="middle">
      ПУЛЬТ-ШАЙБА
    </text>
  </g>

  <!-- Technical Specs Badges -->
  <g transform="translate(40, 50)">
    <rect x="0" y="0" width="160" height="50" rx="8" fill="#18181b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="14" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#fbbf24">CRI > 95 (Ra95)</text>
    <text x="14" y="38" font-family="system-ui, sans-serif" font-size="9" fill="#a1a1aa">Естественные цвета без искажений</text>
  </g>

  <g transform="translate(40, 115)">
    <rect x="0" y="0" width="160" height="50" rx="8" fill="#18181b" stroke="#10b981" stroke-width="1.5" />
    <text x="14" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#34d399">БЕЗ ПУЛЬСАЦИИ</text>
    <text x="14" y="38" font-family="system-ui, sans-serif" font-size="9" fill="#a1a1aa">Коэффициент мерцания &lt; 1%</text>
  </g>
</svg>
