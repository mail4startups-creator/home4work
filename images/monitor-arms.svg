<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgArm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgArm)" />
  <rect x="0" y="360" width="800" height="90" fill="#09090b" />
  <line x1="0" y1="360" x2="800" y2="360" stroke="#334155" stroke-width="2" />

  <!-- Table Edge on the Left -->
  <g transform="translate(140, 240)">
    <rect x="-80" y="0" width="220" height="20" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="2" />
    
    <!-- Heavy Duty Clamp -->
    <rect x="60" y="-8" width="40" height="12" rx="2" fill="#1e293b" />
    <rect x="74" y="4" width="12" height="40" fill="#1e293b" />
    <rect x="65" y="44" width="30" height="10" rx="2" fill="#475569" />
    <circle cx="80" cy="62" r="8" fill="#94a3b8" />

    <!-- Gas Spring Arm Body -->
    <!-- Base Column -->
    <rect x="70" y="-70" width="20" height="70" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />
    <!-- Joint 1 -->
    <circle cx="80" cy="-70" r="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5" />

    <!-- Lower Arm Segment -->
    <path d="M 80 -70 L 160 -150" stroke="#475569" stroke-width="16" stroke-linecap="round" />
    <!-- Joint 2 -->
    <circle cx="160" cy="-150" r="14" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5" />

    <!-- Upper Gas Lift Arm Segment -->
    <path d="M 160 -150 L 260 -110" stroke="#334155" stroke-width="14" stroke-linecap="round" />
    <!-- Gas cylinder indicator line -->
    <line x1="175" y1="-145" x2="245" y2="-115" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />

    <!-- Joint 3 / VESA Swivel Head -->
    <circle cx="260" cy="-110" r="12" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
    <rect x="256" y="-130" width="8" height="40" rx="2" fill="#64748b" />

    <!-- Floating Monitor (27 inch) -->
    <g transform="translate(264, -200)">
      <rect x="0" y="0" width="280" height="160" rx="6" fill="#09090b" stroke="#94a3b8" stroke-width="3" />
      <rect x="8" y="8" width="264" height="144" rx="3" fill="#0284c7" fill-opacity="0.25" />
      
      <!-- Screen content simulation -->
      <line x1="24" y1="28" x2="160" y2="28" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
      <line x1="24" y1="45" x2="200" y2="45" stroke="#64748b" stroke-width="2" />
      <line x1="24" y1="60" x2="180" y2="60" stroke="#64748b" stroke-width="2" />
      
      <!-- Eye-Level Sightline (Gold dotted) -->
      <line x1="-120" y1="12" x2="350" y2="12" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4" />
      <text x="360" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">
        УРОВЕНЬ ГЛАЗ (0–15° ВНИЗ)
      </text>
    </g>

    <!-- Space Under Monitor (40% table space freed up) -->
    <rect x="180" y="-12" width="260" height="24" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 4" />
    <text x="310" y="4" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">
      +40% СВОБОДНОЙ ПЛОЩАДИ СТОЛА
    </text>
  </g>

  <!-- Header Banner -->
  <g transform="translate(400, 48)">
    <rect x="-190" y="-18" width="380" height="34" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="0" y="4" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
      КРОНШТЕЙН ДЛЯ МОНИТОРА С ГАЗЛИФТОМ
    </text>
  </g>
</svg>
