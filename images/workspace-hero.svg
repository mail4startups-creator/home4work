<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#292524" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="wallLight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#44403c" />
      <stop offset="100%" stop-color="#292524" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background Room Wall & Floor -->
  <rect width="800" height="450" fill="url(#bg)" />
  <rect x="0" y="340" width="800" height="110" fill="#171412" />
  <line x1="0" y1="340" x2="800" y2="340" stroke="#44403c" stroke-width="2" />

  <!-- Window Frame with Soft Daylight (Side lighting) -->
  <g transform="translate(40, 50)">
    <rect x="0" y="0" width="130" height="240" rx="8" fill="#38bdf8" fill-opacity="0.15" stroke="#78716c" stroke-width="3" />
    <line x1="65" y1="0" x2="65" y2="240" stroke="#78716c" stroke-width="2" />
    <line x1="0" y1="120" x2="130" y2="120" stroke="#78716c" stroke-width="2" />
    <!-- Light beam hitting the room at 45 deg angle -->
    <polygon points="130,30 500,340 180,340 130,220" fill="#fde047" fill-opacity="0.05" />
  </g>

  <!-- Standing / Ergonomic Desk Structure -->
  <g id="desk" transform="translate(240, 210)">
    <!-- Desktop Surface -->
    <rect x="0" y="0" width="460" height="22" rx="4" fill="#a8a29e" stroke="#d6d3d1" stroke-width="1.5" />
    <!-- T-shaped Steel Legs (Standing Desk Motor Frame) -->
    <rect x="60" y="22" width="16" height="130" fill="#78716c" />
    <rect x="384" y="22" width="16" height="130" fill="#78716c" />
    <!-- Crossbar -->
    <rect x="76" y="70" width="308" height="10" fill="#57534e" />
    <!-- Base feet -->
    <rect x="30" y="148" width="76" height="12" rx="3" fill="#44403c" />
    <rect x="354" y="148" width="76" height="12" rx="3" fill="#44403c" />
    <!-- Control Pad with LED Display -->
    <rect x="410" y="22" width="40" height="14" rx="2" fill="#1c1917" />
    <rect x="420" y="25" width="20" height="6" fill="#38bdf8" />
  </g>

  <!-- Large Ultrawide Monitor with Arm Mount -->
  <g id="monitor" transform="translate(350, 85)">
    <!-- Screen -->
    <rect x="0" y="0" width="240" height="115" rx="6" fill="url(#screenGrad)" stroke="#64748b" stroke-width="2" />
    <!-- Screen glow & code lines -->
    <rect x="15" y="15" width="210" height="85" rx="3" fill="#0f172a" />
    <line x1="30" y1="30" x2="100" y2="30" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    <line x1="30" y1="42" x2="160" y2="42" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="30" y1="54" x2="120" y2="54" stroke="#a7f3d0" stroke-width="2.5" stroke-linecap="round" />
    <line x1="30" y1="66" x2="180" y2="66" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <line x1="30" y1="78" x2="140" y2="78" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
    <!-- Screenbar on top of monitor -->
    <rect x="40" y="-8" width="160" height="6" rx="2" fill="#292524" stroke="#f59e0b" stroke-width="1" />
    <!-- Light cone downwards from screenbar -->
    <polygon points="40,-2 200,-2 280,125 -40,125" fill="#fef08a" fill-opacity="0.12" />
    <!-- Monitor arm pole -->
    <rect x="114" y="115" width="12" height="25" fill="#475569" />
  </g>

  <!-- Ergonomic Mesh Chair with Lumbar Support -->
  <g id="chair" transform="translate(260, 160)">
    <!-- Headrest -->
    <ellipse cx="60" cy="15" rx="26" ry="12" fill="#44403c" stroke="#f59e0b" stroke-width="1.5" />
    <!-- Mesh Backrest -->
    <path d="M42,32 C40,75 35,105 45,125 C50,132 70,132 75,125 C85,105 80,75 78,32 Z" fill="#292524" stroke="#a8a29e" stroke-width="2" />
    <!-- Dynamic Lumbar Pillow Support -->
    <rect x="36" y="90" width="48" height="18" rx="6" fill="#f59e0b" fill-opacity="0.8" />
    <!-- Armrests -->
    <rect x="15" y="90" width="16" height="35" rx="4" fill="#57534e" />
    <rect x="89" y="90" width="16" height="35" rx="4" fill="#57534e" />
    <!-- Seat Cushion -->
    <ellipse cx="60" cy="138" rx="44" ry="16" fill="#383431" stroke="#a8a29e" stroke-width="2" />
    <!-- Piston & Star Base -->
    <rect x="56" y="154" width="8" height="42" fill="#78716c" />
    <path d="M60,196 L15,215 M60,196 L105,215 M60,196 L40,218 M60,196 L80,218" stroke="#57534e" stroke-width="6" stroke-linecap="round" />
    <!-- Castor wheels -->
    <circle cx="15" cy="218" r="5" fill="#292524" />
    <circle cx="105" cy="218" r="5" fill="#292524" />
  </g>

  <!-- Laptop on Stand & Keyboard -->
  <g transform="translate(380, 185)">
    <!-- Compact Laptop -->
    <rect x="0" y="0" width="55" height="38" rx="2" fill="#0f172a" stroke="#94a3b8" stroke-width="1" />
    <rect x="-5" y="38" width="65" height="4" rx="2" fill="#cbd5e1" />
  </g>

  <!-- Minimal Keyboard and Mouse -->
  <g transform="translate(450, 218)">
    <rect x="0" y="0" width="80" height="8" rx="2" fill="#292524" stroke="#78716c" stroke-width="1" />
    <rect x="95" y="0" width="18" height="10" rx="4" fill="#292524" stroke="#f59e0b" stroke-width="1" />
  </g>

  <!-- Plant for Biophilic Design -->
  <g transform="translate(680, 240)">
    <polygon points="15,40 5,80 35,80 25,40" fill="#b45309" />
    <circle cx="20" cy="25" r="22" fill="#15803d" />
    <circle cx="10" cy="15" r="14" fill="#22c55e" />
    <circle cx="30" cy="20" r="16" fill="#16a34a" />
  </g>

  <!-- Subtle Badge overlay -->
  <g transform="translate(40, 390)">
    <rect x="0" y="0" width="220" height="36" rx="8" fill="#1c1917" stroke="#f59e0b" stroke-width="1.5" />
    <text x="110" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fef3c7" text-anchor="middle">
      КАБИНЕТ ДОМА · ЭРГОНОМИКА
    </text>
  </g>
</svg>
