<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgAudio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgAudio)" />
  <rect x="0" y="340" width="800" height="110" fill="#09090b" />
  <line x1="0" y1="340" x2="800" y2="340" stroke="#334155" stroke-width="2" />

  <!-- Audio Waveform / Frequency Grid -->
  <g opacity="0.25">
    <line x1="50" y1="180" x2="750" y2="180" stroke="#64748b" stroke-width="1" stroke-dasharray="4 4" />
    <path d="M 100 180 Q 150 120 200 180 T 300 180 T 400 180 T 500 180 T 600 180 T 700 180" fill="none" stroke="#f59e0b" stroke-width="2" />
  </g>

  <!-- Left: Dynamic XLR/USB Microphone (Fifine K688 style) on Boom Arm -->
  <g transform="translate(180, 100)">
    <!-- Boom Arm Scissor -->
    <line x1="-80" y1="240" x2="-20" y2="120" stroke="#64748b" stroke-width="6" stroke-linecap="round" />
    <line x1="-20" y1="120" x2="40" y2="140" stroke="#64748b" stroke-width="6" stroke-linecap="round" />
    <circle cx="-20" cy="120" r="8" fill="#334155" />
    <circle cx="40" cy="140" r="7" fill="#334155" />

    <!-- Shock Mount (Spider) -->
    <ellipse cx="90" cy="140" rx="36" ry="16" fill="none" stroke="#f59e0b" stroke-width="3" />
    <line x1="60" y1="140" x2="120" y2="140" stroke="#475569" stroke-width="2" />

    <!-- Mic Body -->
    <rect x="68" y="70" width="44" height="110" rx="22" fill="#1e293b" stroke="#cbd5e1" stroke-width="2.5" />
    <rect x="74" y="76" width="32" height="45" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
    <!-- Mesh lines on capsule -->
    <line x1="80" y1="85" x2="100" y2="85" stroke="#64748b" stroke-width="1.5" />
    <line x1="77" y1="95" x2="103" y2="95" stroke="#64748b" stroke-width="1.5" />
    <line x1="80" y1="105" x2="100" y2="105" stroke="#64748b" stroke-width="1.5" />

    <!-- Cardioid Pick-up Pattern Badge -->
    <rect x="30" y="210" width="120" height="26" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
    <text x="90" y="227" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fbbf24" text-anchor="middle">
      КАРДИОИДНЫЙ КАПСЮЛЬ
    </text>
  </g>

  <!-- Right: ENC Headset with Foldable Boom Mic (Jabra Evolve2 style) -->
  <g transform="translate(480, 110)">
    <!-- Headband -->
    <path d="M 60 160 A 80 80 0 0 1 200 160" fill="none" stroke="#475569" stroke-width="10" stroke-linecap="round" />
    <path d="M 70 145 A 70 70 0 0 1 190 145" fill="none" stroke="#0f172a" stroke-width="4" />

    <!-- Left Ear Cup -->
    <rect x="42" y="145" width="34" height="55" rx="14" fill="#1e293b" stroke="#94a3b8" stroke-width="2" />
    <!-- Right Ear Cup -->
    <rect x="184" y="145" width="34" height="55" rx="14" fill="#1e293b" stroke="#94a3b8" stroke-width="2" />

    <!-- Red Busylight LED Ring -->
    <circle cx="59" cy="172" r="6" fill="#ef4444" />
    <circle cx="59" cy="172" r="10" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.6" />

    <!-- Boom Microphone with ENC MEMS Sensors -->
    <path d="M 60 185 L 105 215" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />
    <rect x="105" y="208" width="18" height="14" rx="4" fill="#f59e0b" />
    <circle cx="118" cy="215" r="2.5" fill="#09090b" />

    <!-- Noise Cancellation Waves blocked -->
    <path d="M 135 205 Q 145 215 135 225" fill="none" stroke="#10b981" stroke-width="2.5" />
    <path d="M 145 198 Q 160 215 145 232" fill="none" stroke="#10b981" stroke-width="2.5" opacity="0.6" />

    <!-- Tag -->
    <rect x="50" y="240" width="160" height="26" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="130" y="257" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">
      ENC ШУМОПОДАВЛЕНИЕ МИКРОФОНА
    </text>
  </g>

  <!-- Top Title Banner -->
  <g transform="translate(400, 48)">
    <rect x="-180" y="-18" width="360" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="0" y="4" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
      ЗВУК И МИКРОФОНЫ ДЛЯ СОЗВОНОВ
    </text>
  </g>
</svg>
