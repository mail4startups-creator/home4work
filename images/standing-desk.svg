<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgDesk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgDesk)" />
  <rect x="0" y="360" width="800" height="90" fill="#09090b" />
  <line x1="0" y1="360" x2="800" y2="360" stroke="#3f3f46" stroke-width="2" />

  <!-- Dual Motor Standing Desk in High Position (Standing mode) -->
  <g transform="translate(180, 140)">
    <!-- Thick Ergonomic Wooden Desktop -->
    <rect x="0" y="0" width="440" height="26" rx="4" fill="#d4d4d8" stroke="#f59e0b" stroke-width="2" />
    <!-- Height indicator digital LED screen on edge -->
    <rect x="380" y="26" width="50" height="20" rx="3" fill="#09090b" stroke="#71717a" stroke-width="1" />
    <text x="405" y="40" font-family="monospace" font-size="11" font-weight="800" fill="#38bdf8" text-anchor="middle">108 cm</text>

    <!-- Telescopic 3-segment steel legs extended -->
    <!-- Left Leg -->
    <rect x="50" y="26" width="24" height="60" fill="#71717a" />
    <rect x="53" y="86" width="18" height="60" fill="#52525b" />
    <rect x="55" y="146" width="14" height="65" fill="#3f3f46" />
    <rect x="20" y="211" width="84" height="15" rx="3" fill="#27272a" stroke="#71717a" stroke-width="1" />

    <!-- Right Leg -->
    <rect x="366" y="26" width="24" height="60" fill="#71717a" />
    <rect x="369" y="86" width="18" height="60" fill="#52525b" />
    <rect x="371" y="146" width="14" height="65" fill="#3f3f46" />
    <rect x="336" y="211" width="84" height="15" rx="3" fill="#27272a" stroke="#71717a" stroke-width="1" />

    <!-- Anti-collision Sensor Wire & Cable tray -->
    <rect x="80" y="26" width="280" height="20" rx="2" fill="#27272a" stroke="#f59e0b" stroke-dasharray="3 3" />
    <text x="220" y="40" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#f59e0b" text-anchor="middle">
      ДВА ТИХИХ МОТОРА (&lt; 45 дБ) · СИСТЕМА ЗАЩИТЫ ОТ ЗАЖИМА
    </text>

    <!-- Laptop and Monitor on desk -->
    <rect x="180" y="-85" width="160" height="85" rx="4" fill="#09090b" stroke="#64748b" stroke-width="2" />
    <rect x="190" y="-75" width="140" height="65" rx="2" fill="#1e293b" />
    <rect x="255" y="0" width="10" height="2" fill="#475569" />
  </g>

  <!-- Sit-Stand Cycle Formula Banner on Top -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="340" height="60" rx="10" fill="#18181b" stroke="#f59e0b" stroke-width="2" />
    <text x="170" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#fbbf24" text-anchor="middle">
      ПРАВИЛО SIT-STAND: 45 / 15
    </text>
    <text x="170" y="46" font-family="system-ui, sans-serif" font-size="10" fill="#e4e4e7" text-anchor="middle">
      45 минут работы сидя → 15 минут стоя (защита позвоночника)
    </text>
  </g>
</svg>
