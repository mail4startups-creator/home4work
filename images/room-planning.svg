<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgRoom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#292524" />
    </linearGradient>
    <linearGradient id="sunBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgRoom)" />

  <!-- Floor blueprint grid -->
  <g stroke="#44403c" stroke-width="1" opacity="0.4">
    <line x1="0" y1="360" x2="800" y2="360" stroke-width="2" />
    <line x1="100" y1="360" x2="60" y2="450" />
    <line x1="250" y1="360" x2="220" y2="450" />
    <line x1="400" y1="360" x2="380" y2="450" />
    <line x1="550" y1="360" x2="540" y2="450" />
    <line x1="700" y1="360" x2="710" y2="450" />
  </g>

  <!-- WINDOW on the Left (Side Light) -->
  <g transform="translate(60, 40)">
    <!-- Window frame -->
    <rect x="0" y="0" width="120" height="260" rx="6" fill="#0284c7" fill-opacity="0.15" stroke="#94a3b8" stroke-width="3" />
    <line x1="60" y1="0" x2="60" y2="260" stroke="#94a3b8" stroke-width="2" />
    <line x1="0" y1="130" x2="120" y2="130" stroke="#94a3b8" stroke-width="2" />
    <!-- Daylight Cone hitting desk perpendicularly -->
    <polygon points="120,20 460,340 220,340 120,240" fill="url(#sunBeam)" />
    <!-- Label -->
    <rect x="10" y="275" width="100" height="24" rx="4" fill="#0369a1" />
    <text x="60" y="291" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">ОКНО (БОК)</text>
  </g>

  <!-- RADIATOR / HEATER under window (Correct clearance distance shown) -->
  <g transform="translate(60, 310)">
    <rect x="10" y="0" width="100" height="42" rx="4" fill="#78716c" stroke="#d6d3d1" stroke-width="1.5" />
    <!-- Radiator fins -->
    <line x1="25" y1="5" x2="25" y2="37" stroke="#44403c" stroke-width="2" />
    <line x1="40" y1="5" x2="40" y2="37" stroke="#44403c" stroke-width="2" />
    <line x1="55" y1="5" x2="55" y2="37" stroke="#44403c" stroke-width="2" />
    <line x1="70" y1="5" x2="70" y2="37" stroke="#44403c" stroke-width="2" />
    <line x1="85" y1="5" x2="85" y2="37" stroke="#44403c" stroke-width="2" />
    <line x1="100" y1="5" x2="100" y2="37" stroke="#44403c" stroke-width="2" />
    <!-- Heat waves -->
    <path d="M30,-5 Q40,-15 50,-5" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.6" />
    <path d="M65,-5 Q75,-15 85,-5" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- Distance indicator: Safe Clearance > 25 cm from heater -->
  <g transform="translate(170, 320)">
    <line x1="0" y1="15" x2="70" y2="15" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3 3" />
    <text x="35" y="10" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#f59e0b" text-anchor="middle">Зазор > 25 см</text>
  </g>

  <!-- DESK (Positioned perpendicular to window) -->
  <g transform="translate(250, 230)">
    <!-- Desktop -->
    <rect x="0" y="0" width="340" height="20" rx="4" fill="#e7e5e4" stroke="#a8a29e" stroke-width="1.5" />
    <!-- Legs -->
    <rect x="30" y="20" width="14" height="110" fill="#78716c" />
    <rect x="296" y="20" width="14" height="110" fill="#78716c" />
    <rect x="15" y="125" width="44" height="10" rx="2" fill="#57534e" />
    <rect x="281" y="125" width="44" height="10" rx="2" fill="#57534e" />

    <!-- Cable Basket underneath -->
    <rect x="80" y="22" width="180" height="26" rx="4" fill="#292524" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 2" />
    <text x="170" y="38" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#f59e0b" text-anchor="middle">КАБЕЛЬ-МЕНЕДЖМЕНТ</text>

    <!-- Monitor with screenbar -->
    <rect x="90" y="-90" width="160" height="85" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="2" />
    <rect x="100" y="-80" width="140" height="65" rx="2" fill="#1e293b" />
    <!-- Screenbar -->
    <rect x="110" y="-98" width="120" height="6" rx="2" fill="#f59e0b" />
    <polygon points="110,-92 230,-92 270,0 70,0" fill="#fef08a" fill-opacity="0.1" />
    <rect x="165" y="-5" width="10" height="10" fill="#475569" />
  </g>

  <!-- CHAIR in optimal 90 deg posture -->
  <g transform="translate(420, 200)">
    <rect x="20" y="0" width="50" height="80" rx="6" fill="#44403c" stroke="#f59e0b" stroke-width="2" />
    <ellipse cx="45" cy="85" rx="36" ry="12" fill="#292524" />
    <rect x="42" y="97" width="6" height="45" fill="#78716c" />
    <path d="M45,142 L10,158 M45,142 L80,158" stroke="#57534e" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Zone Badges / Comparison Matrix -->
  <g transform="translate(610, 50)">
    <rect x="0" y="0" width="160" height="260" rx="10" fill="#1c1917" stroke="#57534e" stroke-width="1.5" />
    <text x="80" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#fafaf9" text-anchor="middle">ЗОНЫ В КВАРТИРЕ</text>
    
    <!-- Kitchen -->
    <rect x="10" y="42" width="140" height="42" rx="6" fill="#292524" stroke="#ef4444" stroke-width="1" />
    <text x="20" y="58" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fca5a5">КУХНЯ</text>
    <text x="20" y="74" font-family="system-ui, sans-serif" font-size="9" fill="#a8a29e">Высота 78 см, шум, еда</text>

    <!-- Bedroom -->
    <rect x="10" y="94" width="140" height="42" rx="6" fill="#292524" stroke="#f59e0b" stroke-width="1" />
    <text x="20" y="110" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fcd34d">СПАЛЬНЯ</text>
    <text x="20" y="126" font-family="system-ui, sans-serif" font-size="9" fill="#a8a29e">Тихо, но ломает сон</text>

    <!-- Living room / Balcony -->
    <rect x="10" y="146" width="140" height="46" rx="6" fill="#292524" stroke="#10b981" stroke-width="1.5" />
    <text x="20" y="162" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#6ee7b7">ЛОДЖИЯ / ГОСТИНАЯ</text>
    <text x="20" y="178" font-family="system-ui, sans-serif" font-size="9" fill="#a8a29e">Свет, зонирование, топ</text>
  </g>

  <!-- Top Title -->
  <g transform="translate(60, 400)">
    <text x="0" y="18" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#f59e0b">
      ПРАВИЛО РАССТАНОВКИ: БОКОВОЙ ДНЕВНОЙ СВЕТ И ДИСТАНЦИЯ ОТ ОТОПЛЕНИЯ
    </text>
  </g>
</svg>
