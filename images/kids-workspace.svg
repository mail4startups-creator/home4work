<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgKids" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgKids)" />
  <rect x="0" y="340" width="800" height="110" fill="#09090b" />
  <line x1="0" y1="340" x2="800" y2="340" stroke="#3f3f46" stroke-width="2" />

  <!-- Acoustic Felt Screen Partition (Zoning the room) -->
  <g transform="translate(380, 70)">
    <!-- Tall Felt Screen -->
    <rect x="0" y="0" width="22" height="270" rx="8" fill="#52525b" stroke="#a1a1aa" stroke-width="2" />
    <line x1="11" y1="10" x2="11" y2="260" stroke="#71717a" stroke-width="1.5" stroke-dasharray="6 4" />
    <rect x="-8" y="270" width="38" height="12" rx="3" fill="#27272a" />
    <!-- Noise Absorption waves absorbed -->
    <path d="M-15,60 Q-5,70 -15,80" fill="none" stroke="#f59e0b" stroke-width="2" />
    <path d="M-25,50 Q-10,70 -25,90" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.6" />
    <text x="11" y="-12" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#a1a1aa" text-anchor="middle">
      АКУСТИЧЕСКАЯ ШИРМА
    </text>
  </g>

  <!-- Left: Work Zone with Desk & ENC Headset -->
  <g transform="translate(90, 200)">
    <rect x="0" y="0" width="260" height="18" rx="3" fill="#e4e4e7" stroke="#71717a" stroke-width="1.5" />
    <rect x="20" y="18" width="12" height="120" fill="#71717a" />
    <rect x="230" y="18" width="12" height="120" fill="#71717a" />

    <!-- Laptop with Red Busylight / Headset with mic -->
    <rect x="50" y="-60" width="110" height="60" rx="4" fill="#09090b" stroke="#64748b" stroke-width="1.5" />
    <rect x="55" y="-55" width="100" height="48" rx="2" fill="#0284c7" fill-opacity="0.3" />

    <!-- Headset Jabra ENC with boom arm -->
    <circle cx="190" cy="-20" r="14" fill="#27272a" stroke="#f59e0b" stroke-width="2" />
    <path d="M190,-6 L210,5" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    <circle cx="212" cy="6" r="3" fill="#ef4444" />
    <text x="190" y="-38" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#f59e0b" text-anchor="middle">
      ENC МИКРОФОН
    </text>
  </g>

  <!-- Visual Traffic Light rules on corner of the desk -->
  <g transform="translate(290, 80)">
    <rect x="0" y="0" width="60" height="110" rx="10" fill="#18181b" stroke="#71717a" stroke-width="2" />
    <!-- Red Light: Call in progress -->
    <circle cx="30" cy="24" r="12" fill="#ef4444" stroke="#fca5a5" stroke-width="2" />
    <!-- Yellow Light: Deep focus -->
    <circle cx="30" cy="55" r="12" fill="#eab308" stroke="#fef08a" stroke-width="2" />
    <!-- Green Light: Free to hug & play -->
    <circle cx="30" cy="86" r="12" fill="#22c55e" stroke="#86efac" stroke-width="2" />
    <text x="30" y="130" font-family="system-ui, sans-serif" font-size="9" font-weight="800" fill="#fafafa" text-anchor="middle">
      СВЕТОФОР
    </text>
  </g>

  <!-- Right: Kid's Play Zone with soft carpet & toys -->
  <g transform="translate(460, 240)">
    <!-- Soft circular rug -->
    <ellipse cx="140" cy="90" rx="130" ry="35" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5" />
    <!-- Toy bricks / Lego tower -->
    <rect x="110" y="45" width="22" height="15" fill="#ef4444" rx="2" />
    <rect x="135" y="45" width="22" height="15" fill="#3b82f6" rx="2" />
    <rect x="122" y="30" width="22" height="15" fill="#eab308" rx="2" />
    <rect x="122" y="15" width="22" height="15" fill="#10b981" rx="2" />

    <!-- White Noise machine / Fan on side -->
    <rect x="220" y="45" width="28" height="36" rx="4" fill="#52525b" />
    <circle cx="234" cy="63" r="8" fill="#18181b" />
    <text x="234" y="94" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#a1a1aa" text-anchor="middle">
      БЕЛЫЙ ШУМ
    </text>
  </g>

  <!-- Banner Bottom -->
  <g transform="translate(60, 395)">
    <text x="0" y="16" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#f59e0b">
      УДАЛЕНКА В ОДНУШКЕ С РЕБЕНКОМ: АКУСТИЧЕСКАЯ ШИРМА + МЕТОД «СВЕТОФОР» + ШУМОПОДАВЛЕНИЕ
    </text>
  </g>
</svg>
