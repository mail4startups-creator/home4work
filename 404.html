<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>Кабинет Дома (kabinetdoma.ru)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="text/javascript">
      // GitHub Pages SPA Single Page App router redirect
      // Stores path and query in sessionStorage and redirects to /
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      sessionStorage.setItem('kd_redirect_path', path + search + hash);
      window.location.replace('/');
    </script>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background: #fbfbfa;
        color: #1c1917;
      }
      .loader {
        text-align: center;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #e7e5e4;
        border-top-color: #d97706;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="loader">
      <div class="spinner"></div>
      <p style="font-size: 14px; color: #78716c;">Загрузка раздела KabinetDoma.ru...</p>
    </div>
  </body>
</html>
